name: learners

on:
  pull_request:
    paths: ["learners/**"]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.d.outputs.folders }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: d
        run: |
          folders=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | .github/scripts/changed-learners.sh)
          echo "folders=$folders" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: detect
    if: needs.detect.outputs.folders != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        handle: ${{ fromJSON(needs.detect.outputs.folders) }}
    defaults:
      run:
        working-directory: learners/${{ matrix.handle }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: learners/${{ matrix.handle }}/uv.lock
      # Delta jars are fetched through ivy at Spark start-up.
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2*
          key: ivy-${{ hashFiles(format('learners/{0}/uv.lock', matrix.handle)) }}
      - run: uv run pytest
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false && terraform validate
        working-directory: learners/${{ matrix.handle }}/terraform

  # Stable name for branch protection: matrix job names change with the handle.
  ci:
    needs: [detect, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.detect.result }}" = success ] && [ "${{ needs.test.result }}" != failure ] && [ "${{ needs.test.result }}" != cancelled ]
